name: tradepilot_client
description: TradePilot Android and iOS client foundation.
publish_to: none
version: 0.1.0+1
environment:
  sdk: '>=3.8.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  http: ^1.3.0
  web_socket_channel: ^3.0.2
  flutter_secure_storage: ^11.2.0
  uuid: ^4.5.1
  flutter_svg: ^2.3.0
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
flutter:
  uses-material-design: true
  assets:
    - assets/design/tradepilot.json
    - assets/fonts/OFL.txt
  fonts:
    - family: Noto Sans KR
      fonts:
        - asset: assets/fonts/NotoSansKR.ttf
